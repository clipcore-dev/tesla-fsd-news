name: Tesla FSD Cloudflare Pages

on:
  schedule:
    - cron: '0 6 * * *'
      timezone: Asia/Tokyo
  workflow_dispatch:
    inputs:
      mode:
        description: '記事公開は daily、過去記事の反映は archive、初回のみ bootstrap'
        type: choice
        options: [daily, archive, bootstrap]
        default: daily
      editorial_handoff:
        description: '朝6時タスクの候補JSON。空欄ならWebから調査'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: tesla-fsd-cloudflare-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (vars.DAILY_PUBLISH_ENABLED == 'true' && vars.PUBLISH_HANDOFF_ONLY != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PUBLISH_MODE: ${{ inputs.mode || 'daily' }}
      PUBLISH_HANDOFF_ONLY: ${{ vars.PUBLISH_HANDOFF_ONLY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: prepare
        run: node publish.mjs prepare
        env:
          EDITORIAL_HANDOFF: ${{ inputs.editorial_handoff }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      - id: deploy
        if: steps.prepare.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.PAGES_PROJECT }} --branch=main
      - id: verify
        if: steps.deploy.outcome == 'success'
        run: node publish.mjs verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Restore the previous deployment
        if: failure() && steps.prepare.outputs.previous != '' && (steps.deploy.outcome == 'failure' || steps.verify.outcome == 'failure')
        run: node publish.mjs rollback
        env:
          PREVIOUS_DEPLOYMENT: ${{ steps.prepare.outputs.previous }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Report failure
        if: failure()
        run: echo '初期化・出典照合・ビルド・公開確認のいずれかが失敗しました。該当ステップと切り戻し結果を確認してください。' >> "$GITHUB_STEP_SUMMARY"
